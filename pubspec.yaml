name: nasdash
description: "NAS Dash - TrueNAS SCALE Control Panel & Dashboard for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & Realtime
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5

  # Storage & Security
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # Notifications & Background Tasks
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.5.2

  # Visualization & UI
  fl_chart: ^0.68.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.2

dependency_overrides:
  workmanager:
    path: plugins/workmanager

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
